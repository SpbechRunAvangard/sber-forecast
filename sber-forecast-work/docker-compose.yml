# Запуск одной командой: docker compose up -d --build   (остановка: docker compose down)
# Веб-интерфейс: http://localhost:8000/   API: http://localhost:8000/docs
services:
  forecast:
    build: .
    image: sber-forecast
    container_name: sber-forecast
    ports:
      - "${SBER_PORT:-8000}:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
